name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Shell syntax
        run: find scripts tests -name '*.sh' -type f -exec bash -n {} +
      - name: Input behavior
        run: bash tests/test-inputs.sh
