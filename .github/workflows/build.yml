name: Build and test
on:
  push:
    branches: [main, feat/images-actions]
    tags: ['v[0-9]*']
    paths:
      - 'server/**'
      - 'onec-test/**'
      - 'scripts/**'
      - 'tests/smoke.sh'
      - 'versions.env'
      - '.dockerignore'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 1C platform version
        default: '8.3.27.2130'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Tools / ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: [server, onec-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build dependencies without proprietary distribution
        env:
          IMAGE: ${{ matrix.image }}
        run: docker buildx build --load --target tools -f "$IMAGE/Dockerfile" -t "tools:$IMAGE" .
      - name: Non-root runtime checks
        env:
          IMAGE: ${{ matrix.image }}
        run: bash tests/smoke.sh "tools:$IMAGE" "$IMAGE" tools
  images:
    name: Platform / ${{ matrix.image }} / ${{ matrix.format }}
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [server, onec-test]
        format: [deb, run]
    steps:
      - name: Reserve disk space for platform images
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and test both sources
        id: package
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
          ONEC_VERSION: ${{ inputs.version || '8.3.27.2130' }}
          INSTALL_FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
        run: bash scripts/ci-build-test.sh "$IMAGE"
      - name: Upload verified Docker image TAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
